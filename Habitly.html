<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Habitly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400..700&family=DM+Sans:wght@400..700&display=swap">
<style>
/* Layout: a marketing site that opens into a full-width habit app (sidebar on desktop, bottom bar on phones). */
:root {
  --bg: #E9F0E8; --panel: #F7F6EF; --card: #FFFFFF; --tint: #DDEBE0;
  --ink: #10261F; --ink-2: #43564D; --line: #CBD8CD;
  --accent: #1F6B4F; --on-accent: #F7F6EF; --sun: #E59A1A;
  --leaf-deep: #2F8F6D; --leaf: #4FBF93; --leaf-light: #9ADDBD;
  --h1: #BFE6D1; --h2: #4FBF93; --h3: #1F6B4F;
  --c-move: #FF7A59; --c-eat: #FFB547; --c-sleep: #9B8CFF; --c-mind: #5CC8FF; --c-connect: #5CE0A8; --on-c: #10261F;
  --band: #10261F; --band-ink: #F0EDE2; --band-2: #B7CFC3; --band-card: #18362C;
  --display: "Fraunces", Georgia, serif; --body: "DM Sans", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08140F; --panel: #10261F; --card: #16332A; --tint: #1F4237;
    --ink: #F0EDE2; --ink-2: #A8C1B5; --line: #26493D;
    --accent: #8FE3B8; --on-accent: #0B1A15; --sun: #FFB547;
    --leaf-deep: #2F8F6D; --leaf: #5CCB9F; --leaf-light: #8FE3B8;
    --h1: #245443; --h2: #3FAE86; --h3: #8FE3B8;
    --band: #0C1E18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08140F; --panel: #10261F; --card: #16332A; --tint: #1F4237;
  --ink: #F0EDE2; --ink-2: #A8C1B5; --line: #26493D;
  --accent: #8FE3B8; --on-accent: #0B1A15; --sun: #FFB547;
  --leaf-deep: #2F8F6D; --leaf: #5CCB9F; --leaf-light: #8FE3B8;
  --h1: #245443; --h2: #3FAE86; --h3: #8FE3B8;
  --band: #0C1E18; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--accent); font-weight: 700; }
.wrap { max-width: 1120px; margin: 0 auto; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sun { background: var(--c-eat); color: var(--on-c); }
.btn.sm { padding: 8px 16px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.fine { font-size: 13px; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; padding: 18px; }
.card h3.sec { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; background: var(--tint); color: var(--accent); }
.pill.plus { background: var(--c-eat); color: var(--on-c); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; }
.field input, .field select { padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); width: 100%; min-width: 0; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 8px; font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* site */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 8px 12px; flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 26px; font-weight: 700; background: none; border: 0; padding: 0; color: var(--ink); }
.logo svg { width: 34px; height: 34px; }
.navlinks { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.navlinks button.l { background: none; border: 0; padding: 8px 12px; font-weight: 600; color: var(--ink-2); border-radius: 999px; }
.navlinks button.l:hover { color: var(--ink); background: var(--tint); }
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 32px; align-items: center; padding-block: 36px 56px; }
.hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(40px, 6.4vw, 76px); line-height: 1.04; letter-spacing: -.02em; }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero p.lead { font-size: 19px; color: var(--ink-2); max-width: 46ch; margin-top: 18px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.hero .pillrow { margin-top: 26px; }
.tag { display: inline-block; padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--on-c); }
.heroart { position: relative; }
.heroart svg { width: 100%; height: auto; display: block; }
.sec { padding-block: 56px; }
.sec h2.title { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.1; letter-spacing: -.01em; max-width: 20ch; }
.sec .sub { color: var(--ink-2); max-width: 56ch; margin-top: 12px; font-size: 17px; }
.grid { display: grid; gap: 16px; margin-top: 30px; }
.g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.g5 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.step { background: var(--card); border: 1.5px solid var(--line); border-radius: 26px; padding: 24px; display: grid; gap: 10px; align-content: start; }
.step .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--on-c); }
.step h3 { font-family: var(--display); font-size: 24px; font-weight: 600; }
.step p { color: var(--ink-2); }
.pcard { border-radius: 26px; padding: 22px; color: var(--on-c); display: grid; gap: 8px; align-content: start; }
.pcard .ib { width: 54px; height: 54px; border-radius: 18px; background: var(--band); color: var(--band-ink); display: grid; place-items: center; }
.pcard h3 { font-family: var(--display); font-size: 26px; font-weight: 600; }
.pcard p { font-size: 15px; }
.cmp { display: grid; gap: 10px; margin-top: 30px; }
.cmp .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 14px; }
.cmp .lab { grid-column: 1 / -1; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.cmp .old, .cmp .new { border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.cmp .old { background: var(--tint); color: var(--ink-2); }
.cmp .new { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.band { background: var(--band); color: var(--band-ink); border-radius: 34px; padding: clamp(24px, 5vw, 56px); margin-block: 24px; }
.band .eyebrow { color: #8FE3B8; }
.band h2 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.1; max-width: 18ch; }
.plans { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 28px; }
.plan { background: var(--band-card); border-radius: 26px; padding: 26px; display: grid; gap: 12px; align-content: start; }
.plan.pro { background: var(--c-eat); color: var(--on-c); }
.plan h3 { font-family: var(--display); font-size: 28px; font-weight: 600; }
.plan .price { font-family: var(--display); font-size: 40px; font-weight: 600; line-height: 1; }
.plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plan li { display: flex; gap: 10px; align-items: flex-start; }
.plan li .ic { width: 20px; height: 20px; margin-top: 3px; }
.plan .btn { margin-top: 6px; }
.plan.pro .btn { background: var(--band); color: var(--band-ink); }
.plan:not(.pro) .btn.ghost { color: var(--band-ink); border-color: #3A6556; }
details { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 4px 18px; }
details + details { margin-top: 10px; }
summary { cursor: pointer; font-weight: 700; padding: 14px 0; }
details p { padding-bottom: 14px; color: var(--ink-2); }
.about { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.portrait { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; object-position: center top; background: var(--tint); border: 4px solid var(--accent); flex: none; }
.foot { padding-block: 32px 12px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; border-top: 1.5px solid var(--line); margin-top: 40px; }

/* onboarding */
.onb { max-width: 680px; margin: 24px auto 40px; display: grid; gap: 18px; }
.onb h1 { font-family: var(--display); font-size: clamp(32px, 5vw, 44px); font-weight: 600; line-height: 1.1; }

/* app */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 8px; }
.side { position: sticky; top: 16px; display: grid; gap: 6px; }
.side .nb { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 16px; background: transparent; border: 0; font-weight: 600; text-align: left; color: var(--ink-2); }
.side .nb[aria-current="page"] { background: var(--card); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--line); }
.side .who { padding: 12px 14px 16px; display: grid; gap: 6px; }
.page { display: grid; gap: 14px; max-width: 760px; min-width: 0; }
.bnav { display: none; }
.head2 { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head2 h2 { font-family: var(--display); font-size: 36px; font-weight: 600; line-height: 1.1; }
.head2 .sub { font-size: 14px; color: var(--ink-2); }
.dayctl { display: flex; gap: 6px; align-items: center; }
.dayctl button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; }
.dayctl button[disabled] { opacity: .4; cursor: default; }
.streak { display: inline-flex; align-items: center; gap: 6px; background: var(--tint); color: var(--accent); border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 700; white-space: nowrap; }
.streak .ic { width: 18px; height: 18px; }
.banner { background: var(--c-eat); color: var(--on-c); border-radius: 16px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
.progress { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 18px; align-items: center; }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .t { fill: none; stroke: var(--line); stroke-width: 9; }
.ring .p { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .4s ease; }
.ring.full .p { stroke: var(--sun); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 26px; }
.hab { display: grid; grid-template-columns: 46px minmax(0, 1fr) 30px; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.hab .bx { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--on-c); }
.hab b { display: block; font-size: 16px; overflow-wrap: anywhere; }
.hab .h { font-size: 13px; color: var(--ink-2); }
.hab .tick { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.hab .tick .ic { width: 16px; height: 16px; stroke-width: 3; }
.hab[aria-pressed="true"] { border-color: var(--accent); }
.hab[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.hab[aria-pressed="true"] b { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; }
.tile b { display: block; font-family: var(--display); font-size: 32px; line-height: 1.1; font-weight: 600; }
.tile span { font-size: 13px; color: var(--ink-2); }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; height: 170px; }
.wk .col { display: grid; grid-template-rows: auto 1fr auto; gap: 4px; text-align: center; font-size: 12px; color: var(--ink-2); }
.wk .bw { display: flex; align-items: flex-end; }
.wk .bw i { display: block; width: 100%; border-radius: 8px 8px 4px 4px; background: var(--leaf); }
.wk .col.today { color: var(--ink); font-weight: 700; }
.wk .col.today .bw i { background: var(--sun); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { display: block; aspect-ratio: 1; border-radius: 5px; background: var(--line); min-width: 0; }
.heat i.e { background: transparent; }
.heat i.l1 { background: var(--h1); } .heat i.l2 { background: var(--h2); } .heat i.l3 { background: var(--h3); }
.legend { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; background: var(--line); }
.legend i.l1 { background: var(--h1); } .legend i.l2 { background: var(--h2); } .legend i.l3 { background: var(--h3); }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.pb { display: grid; gap: 5px; margin-top: 12px; }
.pb .row { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
.lock { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.members { display: grid; }
.member { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.member:first-child { border-top: 0; padding-top: 0; }
.av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--tint); color: var(--accent); }
.member b { display: block; font-size: 15px; overflow-wrap: anywhere; }
.treeCard svg.tree { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
.c1 { fill: var(--leaf-deep); } .c2 { fill: var(--leaf); } .c3 { fill: var(--leaf-light); }
.trunk { fill: var(--accent); opacity: .7; } .ground { fill: var(--tint); }
.lf-full { fill: var(--sun); } .lf-mid { fill: var(--card); } .lf-low { fill: var(--line); }
.bloom { display: grid; gap: 6px; margin-top: 12px; }
.bloom .row { display: flex; justify-content: space-between; font-size: 14px; }
.perk, .quest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.perk:first-of-type, .quest:first-of-type { border-top: 0; padding-top: 0; }
.perk b, .quest b { display: block; font-size: 15px; }
.balance { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.balance b { font-family: var(--display); font-size: 52px; line-height: 1; font-weight: 600; }
.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 16px 8px; }
.bd { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 13px; font-weight: 600; line-height: 1.25; }
.bd .c { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.bd.locked .c { background: transparent; border: 2px dashed var(--line); color: var(--ink-2); }
.bd small { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.hrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: 0; padding-top: 0; }
.hrow .bx { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--on-c); }
.hrow b { display: block; overflow-wrap: anywhere; }
.big-av { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 30px; font-weight: 600; background: var(--accent); color: var(--on-accent); flex: none; }
.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.set:first-of-type { border-top: 0; padding-top: 0; }
.modal { position: fixed; inset: 0; background: rgba(8, 20, 15, .66); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal .box { background: var(--card); border-radius: 28px; padding: 24px; max-width: 520px; width: 100%; display: grid; gap: 14px; max-height: calc(100dvh - 32px); overflow-y: auto; }
.modal h2 { font-family: var(--display); font-size: 32px; font-weight: 600; }
.modal ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.modal li { display: flex; gap: 10px; align-items: flex-start; }
.modal li .ic { width: 20px; height: 20px; margin-top: 3px; color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 18px; font-weight: 500; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bnav { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1.5px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); z-index: 30; }
  .bnav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); padding: 4px 0; }
  .bnav button[aria-current="page"] { color: var(--accent); }
  .app-pad { padding-bottom: 84px; }
  .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
(function () {

    var hab = SUGGEST.map(function (s, i) { return '<button class="chip" data-act="pick" data-id="' + i + '" aria-pressed="' + (pick.indexOf(i) >= 0) + '" style="' + (pick.indexOf(i) >= 0 ? '' : '') + '">' + esc(s.name) + '</button>'; }).join('');
    return '<nav class="nav"><button class="logo" data-act="top">' + logoSVG() + 'Habitly</button></nav><div class="onb"><p class="eyebrow">Welcome</p><h1>Let’s set up your grove.</h1><p class="muted">Two minutes. You can change everything later.</p>' +
      '<div class="card" style="display:grid;gap:16px"><div class="field"><label for="o-name">What should friends call you?</label><input id="o-name" maxlength="24" autocomplete="off" value="' + esc(U.name0 || '') + '" placeholder="Your first name"></div>' +
      '<div class="field"><label>Main goal</label><div class="chips">' + goals + '</div></div>' +
      '<div class="field"><label>Pick your starting habits (up to ' + FREE_HABITS + ')</label><div class="chips">' + hab + '</div></div>' +
      '<button class="btn wide" data-act="finish">Start my grove</button></div></div>';
  }

  /* ---------- app shell ---------- */
  var TABS = [['today', 'Today', 'today'], ['habits', 'Habits', 'habits'], ['progress', 'Progress', 'chart'], ['circle', 'Circle', 'tree'], ['rewards', 'Rewards', 'gift'], ['account', 'Account', 'user']];
  function vApp() {

    var bn = TABS.map(function (t) { return '<button data-act="tab" data-id="' + t[0] + '"' + (U.tab === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2]) + t[1] + '</button>'; }).join('');
    return '<nav class="nav"><button class="logo" data-act="top">' + logoSVG() + 'Habitly</button><div class="navlinks"><span class="streak">' + ic('flame') + streak() + ' day streak</span>' +

    var f = { today: vToday, habits: vHabits, progress: vProgress, circle: vCircle, rewards: vRewards, account: vAccount }[U.tab];

  function habitBtn(h, on) {
    var p = PIL[h.pillar];
    return '<button class="hab" data-act="tog" data-id="' + h.id + '" aria-pressed="' + on + '"><span class="bx" style="background:' + p.v + '">' + ic(p.i) + '</span><span><b>' + esc(h.name) + '</b><span class="h">' + p.n + '</span></span><span class="tick">' + ic('check') + '</span></button>';

    var rows = ['date,habit,pillar,done'], ds = Object.keys(D.log).sort();

    DL.save({ filename: 'habitly-history.csv', data: rows.join('\n') }).then(function () { toast('Export saved.'); }, function (e) { if (!e || e.code !== 'declined') toast('Could not save the file here.'); });
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act],[data-scroll]'); if (!a) return;
    if (a.dataset.act === 'closemodal' && e.target.closest('[data-stop]') && !a.closest('.box')) { /* backdrop only */ }
    if (a.dataset.scroll) { var el = document.getElementById(a.dataset.scroll); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var act = a.dataset.act, id = a.dataset.id;
    if (act === 'closemodal' && a.classList.contains('modal') && e.target !== a) return;
    var f = U.form;
    switch (act) {
      case 'top': U.view = 'site'; render(); window.scrollTo(0, 0); break;
      case 'open': if (D && D.habits.length) { U.view = 'app'; U.tab = 'today'; U.date = TODAY; render(); window.scrollTo(0, 0); } else { U.view = 'onboard'; render(); window.scrollTo(0, 0); } break;
      case 'demo': seedDemo(); U.view = 'app'; U.tab = 'today'; U.date = TODAY; render(); window.scrollTo(0, 0); toast('Loaded 4 weeks of sample data.'); break;
      case 'startfresh': D = blank(); save(); stopLive(); U.pick = null; U.view = 'onboard'; render(); break;
      case 'goal0': U.goal0 = id; render(); break;
      case 'pick': var i = U.pick.indexOf(+id); if (i >= 0) U.pick.splice(i, 1); else if (U.pick.length < FREE_HABITS) U.pick.push(+id); else toast('Free plans start with up to 8 habits.'); var nm = $('#o-name'); U.name0 = nm ? nm.value : U.name0; render(); break;
      case 'finish':
        var n0 = ($('#o-name').value || '').trim(); if (!n0) { toast('Add your name first.'); return; }
        if (!U.pick.length) { toast('Pick at least one habit.'); return; }
        D = blank(); D.profile.name = n0; D.profile.goal = U.goal0 || 'Sleep better';
        U.pick.forEach(function (i) { D.habits.push({ id: uid(), name: SUGGEST[i].name, pillar: SUGGEST[i].pillar, days: [0, 1, 2, 3, 4, 5, 6], created: TODAY }); });
        save(); U.view = 'app'; U.tab = 'today'; U.date = TODAY; render(); window.scrollTo(0, 0); toast('Welcome, ' + n0 + '. Your grove is ready.'); break;
      case 'tab': U.tab = id; U.confirm = null; render(); window.scrollTo(0, 0); break;
      case 'prev': if (U.date > addDays(TODAY, -7)) { U.date = addDays(U.date, -1); renderPage(); } break;
      case 'next': if (U.date < TODAY) { U.date = addDays(U.date, 1); renderPage(); } break;
      case 'todaybtn': U.date = TODAY; renderPage(); break;
      case 'tog':
        var wasPerfect = stats(U.date).total >= 3 && stats(U.date).pct === 1; setDone(U.date, id); save(); renderPage(); refreshChrome(); syncMe();
        var s2 = stats(U.date); if (!wasPerfect && s2.total >= 3 && s2.pct === 1) toast('Perfect day. +50 bonus points.'); break;
      case 'mood': var l = D.log[U.date] || (D.log[U.date] = { done: [], mood: null }); l.mood = l.mood === id ? null : id; save(); renderPage(); break;
      case 'fpil': f.pillar = id; var hn = $('#f-hname'); if (hn) f.name = hn.value; renderPage(); break;
      case 'fday': var di = f.days.indexOf(+id); if (di >= 0) { if (f.days.length > 1) f.days.splice(di, 1); } else f.days.push(+id); var hn2 = $('#f-hname'); if (hn2) f.name = hn2.value; renderPage(); break;
      case 'addhab':
        var hv = ($('#f-hname').value || '').trim(); if (!hv) { toast('Name your habit first.'); return; }
        if (addHabit(hv, f.pillar, f.days)) { U.form = null; save(); renderPage(); refreshChrome(); toast('Habit added.'); } break;
      case 'sug': var sg = SUGGEST[+id]; if (addHabit(sg.name, sg.pillar, [0, 1, 2, 3, 4, 5, 6])) { save(); renderPage(); toast('Habit added.'); } break;
      case 'delask': U.confirm = id; renderPage(); break;
      case 'delyes': D.habits = D.habits.filter(function (h) { return h.id !== id; }); U.confirm = null; save(); renderPage(); refreshChrome(); syncMe(); toast('Habit deleted.'); break;
      case 'watersample':
        if (D.watered[TODAY + id]) return; D.watered[TODAY + id] = true; D.waters++; save(); renderPage(); toast('You watered ' + id + '’s leaf. +5 points.');
        setTimeout(function () { D.boost[TODAY + id] = 0.2; save(); if (U.view === 'app' && U.tab === 'circle') renderPage(); toast(id + ' checked in after your nudge (sample).'); }, 1400); break;
      case 'waterlive':
        if (needLive()) return; if (U.nudges.some(function (n) { return n.from === U.uid && n.to === id && n.date === TODAY; })) return;
        DB.doc('circles/' + D.circle.code + '/nudges/' + TODAY + '_' + U.uid + '_' + id).set({ from: U.uid, to: id, date: TODAY, fromName: D.profile.name || 'A friend' })
          .then(function () { D.waters++; save(); toast('You watered a friend’s leaf. +5 points.'); }, function (er) { toast(errMsg(er)); }); break;
      case 'newcircle':
        if (needLive()) return; var cn = ($('#c-name').value || '').trim() || 'My circle', code = code4();
        DB.doc('circles/' + code).set({ name: cn, limit: D.profile.plus ? 10 : 5, owner: U.uid, created: TODAY }).then(function () {
          D.circle = { code: code, name: cn }; save(); tryLive(); renderPage(); toast('Circle created. Share the code ' + code + '.');
        }, function (er) { toast(errMsg(er)); }); break;
      case 'joincircle':
        if (needLive()) return; var jc = ($('#c-code').value || '').trim().toUpperCase(); if (!/^HAB-[A-Z0-9]{4}$/.test(jc)) { toast('Enter a code like HAB-K7QD.'); return; }
        DB.doc('circles/' + jc).get().then(function (s) {
          if (!s.exists) { toast('No circle with that code.'); return; }
          var c = s.data();
          return DB.collection('circles/' + jc + '/members').get().then(function (m) {
            var already = m.docs.some(function (d) { return d.id === U.uid; });
            if (!already && m.size >= (c.limit || 5)) { toast('That circle is full. Its owner can upgrade to Plus for 10 friends.'); return; }
            D.circle = { code: jc, name: c.name || 'Circle' }; save(); tryLive(); renderPage(); toast('You joined ' + (c.name || 'the circle') + '.');
          });
        }).catch(function (er) { toast(errMsg(er)); }); break;
      case 'leave':
        var cc = D.circle; stopLive(); D.circle = null; save(); if (DB && U.uid && cc) DB.doc('circles/' + cc.code + '/members/' + U.uid).delete().catch(function () {}); renderPage(); toast('You left the circle.'); break;
      case 'copycode':
        try { navigator.clipboard.writeText(D.circle.code).then(function () { toast('Code copied.'); }, function () { toast('Select the code and copy it.'); }); } catch (x) { toast('Select the code and copy it.'); } break;
      case 'redeem': var pk = PERKS.filter(function (p) { return p.id === id; })[0]; if (points() >= pk.cost && !D.spent[id]) { D.spent[id] = true; save(); renderPage(); toast('Redeemed. Show the code at the counter (example).'); } break;
      case 'claim': D.claimed[id] = true; save(); renderPage(); toast('Quest reward claimed. +50 points.'); break;
      case 'goal': D.profile.goal = id; save(); renderPage(); break;
      case 'theme': D.profile.theme = id; save(); applyTheme(); renderPage(); break;
      case 'plusmodal': U.modal = 'plus'; render(); break;
      case 'closemodal': U.modal = null; render(); break;
      case 'bill': U.billing = id; render(); break;
      case 'goplus': D = D || blank(); D.profile.plus = true; save(); U.modal = null; render(); toast('Habitly Plus is on (demo). Enjoy the extra room.'); break;
      case 'downgrade': D.profile.plus = false; save(); render(); toast('Back on the Free plan.'); break;
      case 'export': exportCSV(); break;
      case 'resetask': U.confirm = 'reset'; renderPage(); break;
      case 'resetyes': D = blank(); save(); stopLive(); U.confirm = null; U.view = 'site'; render(); window.scrollTo(0, 0); toast('Habitly was reset.'); break;
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'a-name') { D.profile.name = t.value; var b = $('#av-b'); if (b) b.textContent = (t.value.trim().charAt(0) || 'Y').toUpperCase(); save(); syncMe(); }
    else if (t.id === 'f-hname' && U.form) U.form.name = t.value;
    else if (t.id === 'o-name') U.name0 = t.value;
  });
  document.addEventListener('change', function (e) { if (e.target.id === 'a-time') { D.profile.remind = e.target.value; save(); toast('Reminder time saved.'); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && U.modal) { U.modal = null; render(); } });

  if (D && !D.circle) { /* ensure fields exist */ }
  if (D) { D.watered = D.watered || {}; D.boost = D.boost || {}; D.claimed = D.claimed || {}; D.spent = D.spent || {}; D.waters = D.waters || 0; }
  render(); initCaps();
})();
</script>
